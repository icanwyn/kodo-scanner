# Local Postgres for Kōdō Scanner (Vercel uses Neon / Vercel Postgres)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: kodo
      POSTGRES_PASSWORD: kodo
      POSTGRES_DB: kodo
    volumes:
      - kodo_pg:/var/lib/postgresql/data

volumes:
  kodo_pg:
